; AIO Feeder — hub firmware (PLAN.md §7.1, §4.1)
; Board: Waveshare ESP32-S3-Touch-LCD-4.3B — 16 MB flash, 8 MB octal PSRAM. [VERIFY]
; Hub display/UI work is planned against ESP-IDF + LVGL (decision D6 open);
; this Arduino env is the M0 build stub so CI and the web flasher have images.

[platformio]
default_envs = hub_esp32s3

[env:hub_esp32s3]
platform = espressif32@^6
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -D AIO_HUB=1
    -D AIO_FIRMWARE_NAME='"aio-feeder-hub"'
    -I../lib/proto
monitor_speed = 115200
