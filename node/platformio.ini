; AIO Feeder — node firmware (PLAN.md §7.1, §4.9)
; Two MCU targets from one codebase via the HAL: hal_esp8266/ and hal_esp32c3/.
; Portable logic lives in node_core/ (host-tested); src/ is glue only.

[platformio]
default_envs = node_esp32c3

[env:node_esp8266]
platform = espressif8266@^4
board = esp12e                  ; generic ESP-12F class module [VERIFY against your node build]
framework = arduino
board_upload.flash_size = 4MB
build_flags =
    -D AIO_NODE=1
    -D AIO_NODE_8266=1
    -D AIO_FIRMWARE_NAME='"aio-feeder-node8266"'
    -I../lib/proto
    -I../node_core
monitor_speed = 115200

[env:node_esp32c3]
platform = espressif32@^6
board = esp32-c3-devkitm-1      ; ESP32-C3 SuperMini class [VERIFY]
framework = arduino
build_flags =
    -D AIO_NODE=1
    -D AIO_NODE_C3=1
    -D AIO_FIRMWARE_NAME='"aio-feeder-nodec3"'
    -I../lib/proto
    -I../node_core
monitor_speed = 115200
