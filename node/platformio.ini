; AIO Feeder — node firmware (PLAN.md §7.1, §4.9)
; Two MCU targets from one codebase via the HAL: hal_esp8266/ and hal_esp32c3/.
; Portable logic lives in node_core/ (host-tested); src/ is glue only.

[platformio]
default_envs = node_esp32c3

[env:node_esp8266]
platform = espressif8266@^4
board = esp12e                  ; generic ESP-12F class module [VERIFY against your node build]
framework = arduino
board_upload.flash_size = 4MB
; 1 MB FS layout → ~2.6 MB scratch between sketch end and FS start: HTTPUpdate
; writes the staged image there. EEPROM sits at flash end (0x3FB000, linker
; symbol) in every 4 MB layout — outside the OTA scratch area, config is safe.
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    -D AIO_NODE=1
    -D AIO_NODE_8266=1
    -D AIO_FIRMWARE_NAME='"aio-feeder-node8266"'
    -D AIO_NODE_FW_VER=0x000C00u   ; v0.12.0 — bump with each release (HELLO ext, D40)
    -D AIO_NODE_MCU=MCU_ESP8266
    -I../lib/proto
    -I../node_core
monitor_speed = 115200

[env:node_esp32c3]
platform = espressif32@^6
board = esp32-c3-devkitm-1      ; ESP32-C3 SuperMini class [VERIFY]
framework = arduino
; M8b dual-slot OTA (§7.6): two 1.5 MB slots + otadata; bootloader rolls back
; a slot that never confirms. One-time USB re-flash after upgrading from the
; pre-M8b single-slot layout.
board_build.partitions = partitions_c3_ota.csv
build_flags =
    -D AIO_NODE=1
    -D AIO_NODE_C3=1
    -D AIO_FIRMWARE_NAME='"aio-feeder-nodec3"'
    -D AIO_NODE_FW_VER=0x000C00u   ; v0.12.0 — bump with each release (HELLO ext, D40)
    -D AIO_NODE_MCU=MCU_ESP32C3
    -I../lib/proto
    -I../node_core
monitor_speed = 115200
