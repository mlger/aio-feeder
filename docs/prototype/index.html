<title>AIO Feeder — Hub Display</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 96 96%27%3E%3Crect width=%2796%27 height=%2796%27 rx=%2718%27 fill=%27%230d1216%27/%3E%3Cpath d=%27M22 22h52L56 48v14l-16 8V48z%27 fill=%27none%27 stroke=%27%232dd4bf%27 stroke-width=%276%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%2748%27 cy=%2780%27 r=%275%27 fill=%27%232dd4bf%27/%3E%3C/svg%3E">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ---------- Product tokens ---------- */
:root {
  --bg: #0d1216;
  --surface: #151c22;
  --surface-2: #1d2730;
  --surface-3: #26333e;
  --line: #2f3d49;
  --text: #e9eff3;
  --muted: #a3b3bf;
  --accent: #2dd4bf;
  --accent-ink: #04201c;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #ff8a80;
  --bad-solid: #b42318;
  --focus: #ffffff;

  --fs-cap: 14px;
  --fs-body: 16px;
  --fs-lead: 18px;
  --fs-title: 22px;
  --fs-big: 30px;
  --font-ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-num: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --r-sm: 6px; --r-md: 10px;
  --t-fast: 150ms; --t-med: 250ms;
  --h-status: 40px; --h-nav: 64px; --tap: 48px;

  --accent-hover: #5eead4; --warn-ink: #1a1200; --disabled-fg: #8a99a4;
  --banner-bad-bg: #3a1714; --banner-bad-fg: #ffd4cf; --banner-warn-bg: #33280a; --banner-warn-fg: #ffe9a8;
}
html[data-theme="light"] {
  --bg: #eef2f5; --surface: #ffffff; --surface-2: #e6ecf0; --surface-3: #d3dce3; --line: #aebbc6;
  --text: #12202a; --muted: #4a5b68;
  --accent: #0f766e; --accent-ink: #ffffff; --ok: #15803d; --warn: #9a4a05; --bad: #b42318; --bad-solid: #b42318;
  --focus: #0b1620; --accent-hover: #115e59; --warn-ink: #ffffff; --disabled-fg: #5d6b76;
  --banner-bad-bg: #fde4e1; --banner-bad-fg: #7a1810; --banner-warn-bg: #fdecc8; --banner-warn-fg: #5a2d00;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #05080a; overflow: hidden; }
body { font-family: var(--font-ui); color: var(--text); font-size: var(--fs-body); line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.cap { font-size: var(--fs-cap); color: var(--muted); line-height: 1.4; }

/* ---------- Stage (fixed 800x480 panel, scaled to fit) ---------- */
#stage { position: absolute; left: 50%; top: 50%; width: 800px; height: 480px; background: var(--bg); overflow: hidden; transform-origin: center; }
#app { width: 800px; height: 480px; display: grid; grid-template-rows: var(--h-status) minmax(0, 1fr) var(--h-nav); }

/* status bar */
#status { display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s4); background: var(--surface); border-bottom: 1px solid var(--line); font-size: var(--fs-cap); }
#status .clock { font-size: var(--fs-lead); font-weight: 700; }
#status .item { display: flex; align-items: center; gap: var(--s1); color: var(--muted); white-space: nowrap; }
#status .item .od-icon { --od-icon-size: 16px; }
#status .item.warn { color: var(--warn); font-weight: 700; }
#status .item.warn { background: var(--banner-warn-bg); padding: 2px var(--s2); border-radius: var(--r-sm); }
#status .sp { flex: 1; }
#alertBadge { display: flex; align-items: center; gap: var(--s1); min-height: 32px; padding: 0 var(--s3); border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
#alertBadge.has { border-color: var(--warn); color: var(--warn); }
#alertBadge .od-icon { --od-icon-size: 16px; }

/* nav */
#nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); }
#nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font-size: var(--fs-cap); font-weight: 600; position: relative; transition: color var(--t-fast), background var(--t-fast); }
#nav button .od-icon { --od-icon-size: 26px; }
#nav button[aria-current="page"] { color: var(--accent); background: var(--surface-2); }
#nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
#nav .nbadge { position: absolute; top: 6px; left: calc(50% + 10px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--warn); color: var(--warn-ink); font-size: 14px; font-weight: 700; line-height: 20px; text-align: center; }

#view { min-height: 0; overflow: hidden; outline: none; }

/* themed, touch-friendly scrollbar: slim track, high-contrast thumb, no layout shift */
:root { --scroll-thumb: #6f8291; --scroll-thumb-hover: #9fb0bc; }
html[data-theme="light"] { --scroll-thumb: #6b7c89; --scroll-thumb-hover: #3f505c; }
.od-scroll, #dlg { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; scrollbar-gutter: stable; }
.od-scroll::-webkit-scrollbar, #dlg::-webkit-scrollbar { width: 10px; height: 10px; }
.od-scroll::-webkit-scrollbar-track, #dlg::-webkit-scrollbar-track { background: transparent; }
.od-scroll::-webkit-scrollbar-thumb, #dlg::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
@media (hover: hover) { .od-scroll::-webkit-scrollbar-thumb:hover, #dlg::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); } }
.screen { height: 100%; }
.sbar { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); min-height: 56px; border-bottom: 1px solid var(--line); }
.sbar h1 { font-size: var(--fs-title); font-weight: 700; }
.pad { padding: var(--s4); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--tap); padding: 0 var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-weight: 600; white-space: nowrap; transition: background var(--t-fast), border-color var(--t-fast); }
.btn .od-icon { --od-icon-size: 20px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--bad-solid); border-color: var(--bad-solid); color: #fff; }
.btn.sm { min-height: 44px; padding: 0 var(--s3); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--surface); color: var(--disabled-fg); border-color: var(--line); cursor: not-allowed; }
.btn.primary:disabled { background: var(--surface-3); color: var(--disabled-fg); border-color: var(--surface-3); }
@media (hover: hover) { .btn:not(:disabled):hover { background: var(--surface-3); } .btn.primary:not(:disabled):hover { background: var(--accent-hover); } .btn.danger:not(:disabled):hover { background: #d92d20; } }
.btn.back { padding: 0 var(--s3) 0 var(--s2); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: var(--s1); height: 28px; padding: 0 var(--s2); border-radius: 14px; border: 1px solid currentColor; font-size: var(--fs-cap); font-weight: 700; white-space: nowrap; }
.pill .od-icon { --od-icon-size: 16px; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.off { color: var(--muted); }

/* banner */
.banner { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 48px; padding: var(--s2) var(--s4); border: 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 600; }
.banner.bad { background: var(--banner-bad-bg); color: var(--banner-bad-fg); } .banner.warn { background: var(--banner-warn-bg); color: var(--banner-warn-fg); }
.banner .od-icon { --od-icon-size: 24px; }

/* home strip + grid + tiles */
.strip { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: var(--s2) var(--s4); background: var(--surface); border-bottom: 1px solid var(--line); }
.strip.bad { background: var(--banner-bad-bg); color: var(--banner-bad-fg); } .strip.warn { background: var(--banner-warn-bg); color: var(--banner-warn-fg); }
.strip .cap { color: inherit; opacity: .9; }
.strip > .od-icon { --od-icon-size: 24px; }
.qind { font-weight: 700; white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); padding: var(--s3) var(--s4); }
.tile { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--ok); border-radius: var(--r-md); overflow: hidden; }
.tile.fault { border-color: var(--bad); border-top-width: 6px; background: var(--banner-bad-bg); }
.tile.offline { border-top-color: var(--muted); border-style: dashed; border-top-style: solid; }
.tile-main { display: grid; gap: var(--s2); padding: var(--s2) var(--s3); border: 0; background: transparent; text-align: left; flex: 1; align-content: start; }
.tile-main > * { display: block; min-width: 0; }
.tile-name { font-size: var(--fs-lead); font-weight: 700; }
.next-val { font-size: 22px; font-weight: 700; line-height: 1.2; }
.chip { display: inline-flex; align-items: center; gap: var(--s1); height: 28px; padding: 0 var(--s2); border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-cap); white-space: nowrap; }
.chip .od-icon { --od-icon-size: 16px; }
.chip.warn { color: var(--warn); background: var(--banner-warn-bg); } .chip.bad { color: var(--bad); background: var(--banner-bad-bg); }
.tile .foot { padding: 0 var(--s3) var(--s3); }
.tile-top { display: flex !important; align-items: center; justify-content: space-between; gap: var(--s1); }
.tile-go { font-size: 24px; line-height: 1; color: var(--muted); }
.tile-name { overflow-wrap: anywhere; line-height: 1.25; }
.lvl { display: block; height: 6px; background: var(--surface-2); }
.lvl > span { display: block; height: 100%; background: var(--ok); }
.lvl.low > span { background: var(--warn); }
.tile.offline .tile-main { opacity: .8; }
textarea { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s2); resize: none; }
.tile .bar { display: block; }
.note { margin-top: 4px; min-height: 21px; }
.note.warnt { color: var(--warn); font-weight: 600; } .note.badt { color: var(--bad); font-weight: 600; }
.val { font-weight: 600; }

/* hold-to-confirm */
.hold { position: relative; width: 100%; min-height: 52px; border-radius: var(--r-md); border: 2px solid var(--accent); background: var(--surface-2); color: var(--text); font-weight: 700; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.hold .fill { position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; }
.hold .lbl { position: relative; display: flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 48px; }
.hold .lbl .od-icon { --od-icon-size: 20px; }
.hold.holding .fill { animation: holdfill 800ms linear forwards; }
.hold.holding .lbl { color: var(--accent-ink); }
@keyframes holdfill { to { transform: scaleX(1); } }
.hold:disabled { border-color: var(--line); color: var(--disabled-fg); background: var(--surface); cursor: not-allowed; }
.hold.busy { border-color: var(--warn); color: var(--warn); }
@media (prefers-reduced-motion: reduce) { .hold.holding .fill { animation: none; transform: scaleX(1); opacity: .6; } }

/* detail */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); padding: var(--s4); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3) var(--s4); }
.panel.danger { border-color: var(--bad); }
.panel h2 { font-size: var(--fs-lead); margin-bottom: var(--s2); }
.kv { display: flex; justify-content: space-between; gap: var(--s3); padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv > span:first-child { color: var(--muted); }
.kv > span:last-child { font-weight: 600; text-align: right; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-top: 4px; }
.bar > div, .bar > span { display: block; height: 100%; background: var(--accent); }
.bar.high > div, .bar.high > span { background: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* stepper / switch */
.stepper { display: inline-flex; align-items: center; gap: var(--s2); }
.stepper .btn { width: var(--tap); padding: 0; }
.stepper output { min-width: 72px; text-align: center; font-size: var(--fs-lead); font-weight: 700; }
.switch { width: 88px; height: 44px; border-radius: 22px; border: 2px solid var(--line); background: var(--surface-3); position: relative; padding: 0; transition: background var(--t-fast); flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 50%; background: var(--text); transition: transform var(--t-fast); }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(44px); background: var(--accent-ink); }
.switch .t { position: absolute; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 800; letter-spacing: .02em; }
.switch .t.on { left: 10px; color: var(--accent-ink); opacity: 0; } .switch .t.off { right: 9px; color: var(--muted); }
.switch[aria-checked="true"] .t.on { opacity: 1; } .switch[aria-checked="true"] .t.off { opacity: 0; }

/* lists */
.item { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); min-height: 56px; }
.item .time { font-size: var(--fs-big); font-weight: 700; line-height: 1.1; }
.dots { display: flex; gap: 4px; }
.dots span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; border: 1px solid var(--line); color: var(--muted); }
.dots span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.jump { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: var(--s2); padding-bottom: var(--s2); }
.rail { display: flex; gap: var(--s2); overflow-x: auto; padding: var(--s3) var(--s4); scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.fchip { min-height: 44px; padding: 0 var(--s4); border-radius: 22px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; white-space: nowrap; flex: none; }
.fchip[aria-pressed="true"], .fchip[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select, input[type="text"], input[type="password"], input[type="number"] { min-height: var(--tap); padding: 0 var(--s3); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); }
input[type="number"] { font-variant-numeric: tabular-nums; font-weight: 600; -moz-appearance: textfield; }
input::placeholder { color: var(--muted); opacity: 1; }
.unitfield { position: relative; display: block; }
.unitfield input { width: 100%; padding-right: 44px; }
.unitfield .u { position: absolute; right: var(--s3); top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.capform { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); align-items: end; }
.capsum { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.capbar { flex: 1 1 100%; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.capbar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease-out; }
.capbar.low > i { background: var(--warn); }
input[type="range"] { width: 100%; height: 44px; accent-color: var(--accent); }
label.lab { display: block; font-size: var(--fs-cap); color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.err { color: var(--bad); font-size: var(--fs-cap); font-weight: 600; margin-top: 4px; }
.empty { display: grid; place-items: center; text-align: center; gap: var(--s2); padding: var(--s5); color: var(--muted); min-height: 200px; }
.empty .od-icon { --od-icon-size: 40px; }
.empty b { color: var(--text); font-size: var(--fs-lead); }
.sec { padding: var(--s4); border-bottom: 1px solid var(--line); display: grid; gap: var(--s3); }
.sec h2 { font-size: var(--fs-lead); }
.srow { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); }
.srow .od-field { flex: 1; }
.skel { height: 56px; border-radius: var(--r-md); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* overlays */
#scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 20; }
#dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; z-index: 21; width: 600px; max-width: 760px; max-height: 464px; overflow-y: auto; padding: var(--s4) var(--s5); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-md); }

@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

<body>
<div id="stage">

  <div id="dim" hidden><div class="big num" id="dimclk"></div><div>Touch to wake</div></div>
  <div id="boot" hidden role="status" aria-live="polite"><svg class="mark" viewBox="0 0 96 96" role="img" aria-label="AIO Feeder logo"><path pathLength="1" d="M22 22h52L56 48v14l-16 8V48z"/><circle cx="48" cy="82" r="5"/></svg><div class="word"><b>AIO</b> Feeder</div><div class="tag">All-in-one automated feeding hub</div><ol id="bootsteps"></ol><div class="prog" aria-hidden="true"><div id="bootprog"></div></div><div class="ver">Hub firmware 0.3.1 · tap to skip</div></div>
</div>

<script>
/* ===== Helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {
  home: 'M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6',
  calendar: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
  history: 'M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2',

  check: 'M5 12l5 5 9-10', x: 'M6 6l12 12M18 6L6 18',

  wifi: 'M3 9a14 14 0 0 1 18 0M6 12.5a9 9 0 0 1 12 0M9 16a4 4 0 0 1 6 0M12 19.5v.1',
  wifioff: 'M3 9a14 14 0 0 1 18 0M6 12.5a9 9 0 0 1 12 0M9 16a4 4 0 0 1 6 0M12 19.5v.1M4 4l16 16',
  sd: 'M7 3h8l3 3v15H7zM10 7v3M13 7v3',
  clock: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 8v4l3 2',
  drop: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
  bolt: 'M13 3L5 14h6l-1 7 8-11h-6z',
  bowl: 'M5 10h14l-2 9H7zM8 10V6h8v4',
  download: 'M12 4v11M7 11l5 5 5-5M5 20h14',
  trash: 'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',
  pause: 'M8 5v14M16 5v14', play: 'M7 4l13 8-13 8z',
  flask: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3',
  link: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
  edit: 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4',

};
const icon = (n, size) => `<svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${size ? ` style="--od-icon-size:${size}px"` : ''}><path d="${ICONS[n]}"/></svg>`;

const MIN = 60000, HOUR = 3600000;
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const pad2 = n => String(n).padStart(2, '0');
const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ===== Time zone aware helpers (everything shown/scheduled uses the hub's time zone setting) ===== */
let fmt;
function setTz(tz) {
  fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function parts(ts) {
  const o = {}; for (const p of fmt.formatToParts(new Date(ts))) o[p.type] = p.value;
  const y = +o.year, mo = +o.month, d = +o.day;
  return { y, mo, d, h: +o.hour % 24, mi: +o.minute, s: +o.second, dow: new Date(Date.UTC(y, mo - 1, d)).getUTCDay() };
}
const hhmm = ts => { const p = parts(ts); return `${pad2(p.h)}:${pad2(p.mi)}`; };
function dayLabel(ts) {
  const a = parts(Date.now()), b = parts(ts);
  const da = Date.UTC(a.y, a.mo - 1, a.d), db = Date.UTC(b.y, b.mo - 1, b.d);
  const diff = Math.round((db - da) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  return DAYS[b.dow];
}
const stamp = ts => `${dayLabel(ts)} ${hhmm(ts)}`;
function ago(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return 'just now';
  if (d < HOUR) return `${Math.round(d / MIN)} min ago`;
  if (d < 24 * HOUR) return `${Math.round(d / HOUR)} h ago`;
  return stamp(ts);
}
function nextOccurrence(h, mi, days, after) {
  const now = Date.now(), lim = after || now, p = parts(now);
  const off = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(now / 1000) * 1000;
  for (let dd = 0; dd < 16; dd++) {
    const dow = new Date(Date.UTC(p.y, p.mo - 1, p.d + dd)).getUTCDay();
    if (!days[dow]) continue;
    const ts = Date.UTC(p.y, p.mo - 1, p.d + dd, h, mi, 0) - off;
    if (ts > lim) return ts;
  }
  return null;
}

/* ===== Data ===== */
const CODE = {
  OK: ['Fed OK', 'ok', 'ok'],
  REJ_COOLDOWN: ['Cooling down', 'warn', 'rej'], REJ_LIMIT_HOUR: ['Hourly cap reached', 'warn', 'rej'], REJ_LIMIT_DAY: ['Daily cap reached', 'warn', 'rej'],
  REJ_TOO_LONG: ['Amount over per-feed cap', 'warn', 'rej'], REJ_NO_TIME: ['No valid time', 'warn', 'rej'], REJ_FAULT: ['Node in fault', 'bad', 'rej'], REJ_LOW_VOLT: ['Supply voltage low', 'bad', 'rej'],
  SKIPPED_USER: ['Skipped by user', 'warn', 'rej'], SKIPPED_HOLD: ['Skipped: hold mode', 'warn', 'rej'],
  ABORTED: ['Aborted', 'warn', 'fault'], GATE_NOT_OPENED: ['Gate did not open', 'bad', 'fault'], GATE_STUCK_OPEN: ['Gate stuck open', 'bad', 'fault'], TIMEOUT_NO_RESULT: ['No result from node', 'bad', 'fault']
};
const SEV = { ok: ['check', 'OK'], warn: ['alert', 'Warn'], bad: ['alert', 'Fault'] };

function seed() {
  const t = Date.now();
  const mk = (o) => Object.assign({ feed: null, paused: false, lastAct: 0, calAt: t - 9 * 86400000, missed: 'skip', pushedAt: t - 2 * HOUR }, o);
  const nodes = [
    mk({ id: 'n1', name: 'Koi Pond', mcu: 'ESP32-C3', mech: 'Solenoid gate', kind: 'gate', unit: 'g', status: 'online', hopper: 'ok', vin: 12080, rssi: -58, fw: '0.4.2', amount: 10, step: 5, cal: 4, calIn: 's', calOut: 'g', test: 2, maxAmount: 25, hourCap: 40, dayCap: 100, maxOnMs: 10000, cooldownS: 15, scheds: [{ id: 's1', h: 7, m: 0, days: [1, 1, 1, 1, 1, 1, 1], amount: 10, on: true }, { id: 's2', h: 18, m: 0, days: [1, 1, 1, 1, 1, 1, 1], amount: 10, on: true }] }),
    mk({ id: 'n2', name: 'Poultry Grain', mcu: 'ESP8266', mech: 'Auger via relay', kind: 'auger', unit: 'g', status: 'online', hopper: 'ok', vin: 11940, rssi: -66, fw: '0.4.2', amount: 120, step: 10, cal: 24, calIn: 's', calOut: 'g', test: 5, maxAmount: 300, hourCap: 400, dayCap: 900, maxOnMs: 15000, cooldownS: 30, scheds: [{ id: 's3', h: 6, m: 30, days: [1, 1, 1, 1, 1, 1, 1], amount: 120, on: true }] }),
    mk({ id: 'n3', name: 'Aquarium Dosing', mcu: 'ESP32-C3', mech: 'Pump via relay', kind: 'pump', unit: 'ml', status: 'online', hopper: 'low', vin: 12110, rssi: -49, fw: '0.4.2', amount: 40, step: 5, cal: 8, calIn: 's', calOut: 'ml', test: 5, maxAmount: 100, hourCap: 150, dayCap: 400, maxOnMs: 12000, cooldownS: 15, scheds: [{ id: 's4', h: 8, m: 0, days: [1, 1, 1, 1, 1, 1, 1], amount: 40, on: true }] }),
    mk({ id: 'n4', name: 'Barn Pellets', mcu: 'ESP8266', mech: 'Solenoid gate', kind: 'gate', unit: 'g', status: 'offline', hopper: 'ok', vin: null, rssi: null, fw: '0.4.1', seen: t - 22 * MIN, pushedAt: t - 6.4 * 86400000, amount: 20, step: 5, cal: 4.4, calIn: 's', calOut: 'g', test: 2, maxAmount: 40, hourCap: 70, dayCap: 140, maxOnMs: 10000, cooldownS: 15, scheds: [{ id: 's5', h: 6, m: 0, days: [1, 1, 1, 1, 1, 1, 1], amount: 20, on: true }, { id: 's6', h: 17, m: 30, days: [1, 1, 1, 1, 1, 1, 1], amount: 20, on: true }] }),
    mk({ id: 'n5', name: 'Kennel Kibble', mcu: 'ESP32-C3', mech: 'Solenoid gate', kind: 'gate', unit: 'g', status: 'fault', faultCode: 'GATE_STUCK_OPEN', hopper: 'ok', vin: 11870, rssi: -61, fw: '0.4.2', amount: 10, step: 5, cal: 6, calIn: 's', calOut: 'g', test: 2, maxAmount: 20, hourCap: 25, dayCap: 60, maxOnMs: 10000, cooldownS: 15, scheds: [{ id: 's7', h: 7, m: 30, days: [1, 1, 1, 1, 1, 1, 1], amount: 10, on: true }, { id: 's8', h: 19, m: 0, days: [0, 1, 1, 1, 1, 1, 0], amount: 10, on: true }] })
  ];
  const H = [
    ['n5', 50, 10, 'GATE_STUCK_OPEN', 2500], ['n1', 95, 10, 'OK', 1100], ['n4', 210, 20, 'OK', 1500], ['n2', 180, 120, 'OK', 5200],
    ['n3', 300, 40, 'OK', 5000], ['n1', 8 * 60, 10, 'OK', 1100], ['n4', 9 * 60, 20, 'TIMEOUT_NO_RESULT', 0], ['n2', 15 * 60, 120, 'OK', 5100],
    ['n1', 14 * 60, 10, 'OK', 1100], ['n3', 17 * 60, 40, 'REJ_LOW_VOLT', 0], ['n5', 20 * 60, 10, 'OK', 900], ['n1', 20 * 60, 10, 'OK', 1100], ['n5', 26 * 60, 10, 'OK', 900]
  ].map((r, i) => {
    const n = nodes.find(x => x.id === r[0]);
    return { id: 'h' + i, t: t - r[1] * MIN, nodeId: r[0], amount: r[2], unit: n.unit, code: r[3], ms: r[4], src: 'schedule' };
  }).sort((a, b) => b.t - a.t);
  for (const n of nodes) { const last = H.find(h => h.nodeId === n.id && h.code === 'OK'); n.lastAct = last ? last.t : 0; }
  /* sample stock estimates, notes and a week of earlier feeds so the 7-day chart has something to show */
  const LV = { n1: [62, 1500, 'Koi: cut to 5 g when the water is cold.'], n2: [55, 5000, ''], n3: [14, 1000, ''], n4: [70, 3000, ''], n5: [80, 1200, ''] };
  for (const n of nodes) { const v = LV[n.id]; n.lvl = v[0]; n.capacity = v[1]; n.note = v[2]; n.refills = [{ t: t - (n.id === 'n3' ? 9 : 4) * 86400000, lvl: 100 }]; n.hopper = v[0] <= 20 ? 'low' : 'ok'; }
  for (let d = 2; d <= 7; d++) for (const n of nodes) n.scheds.forEach((sc, i) => { H.push({ id: 'hs' + d + n.id + i, t: t - d * 86400000 - i * 180000, nodeId: n.id, amount: sc.amount, unit: n.unit, code: 'OK', ms: 1500, src: 'schedule' }); });
  H.sort((a, b) => b.t - a.t);
  const alerts = [
    { id: 'a1', sev: 'bad', nodeId: 'n5', text: 'Gate stuck open — feeding is locked until you clear the fault.', t: t - 50 * MIN, ack: false },
    { id: 'a2', sev: 'warn', nodeId: 'n4', text: 'Offline — 3 heartbeats missed. Scheduled feeds are being skipped.', t: t - 22 * MIN, ack: false },
    { id: 'a3', sev: 'warn', nodeId: 'n3', text: 'Reservoir level estimated low. Refill before the next dose.', t: t - 3 * HOUR, ack: false },
    { id: 'a4', sev: 'warn', nodeId: null, text: 'Hub restarted after a power cut. Schedules resumed once the time was synced.', t: t - 2 * 86400000, ack: true }
  ];
  return { nodes, history: H, alerts, pairing: null };
}

/* sample state persists in localStorage when the preview allows it; otherwise it stays in memory */
const KEY = 'aio-hub-demo-v6';
function loadSaved() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!o || !o.D || !Array.isArray(o.D.nodes)) return null;
    o.D.nodes.forEach(n => { n.feed = null; });
    return o;
  } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ D: { nodes: D.nodes, history: D.history.slice(0, 200), alerts: D.alerts }, settings: S.settings })); } catch (e) { }
}
let D = seed();
const SAVED = loadSaved();
if (SAVED) D = { nodes: SAVED.D.nodes, history: SAVED.D.history || [], alerts: SAVED.D.alerts || [], pairing: null };
const S = {
  view: 'home', nodeId: null, schedNode: 'n1', hFilter: 'all', hNode: 'all',
  settings: { bright: 90, off: 60, ntp: true, tz: 'UTC', ssid: 'FarmNet-2G', broker: 'mqtt.local:1883', mqtt: true, pin: false, theme: 'dark', web: true, port: '80', login: true, muser: 'aio-hub', mpass: 'sample-pass', tls: false, ha: true, pinScope: 'settings', pinCode: '', retain: '30', holdUntil: 0, nOn: true, nOffline: true, nFault: true, nMissed: true, nLow: true },
  cal: null, edit: null, setup: null, notif: [], backupAt: 0, sd: 'ok', unlockUntil: 0, pinThen: null, pinErr: '', syncedAt: Date.now() - 4 * MIN, otaState: 'idle'
};
try { const z = Intl.DateTimeFormat().resolvedOptions().timeZone; if (z) S.settings.tz = z; } catch (e) { }
if (SAVED && SAVED.settings) Object.assign(S.settings, SAVED.settings);
let BACKUP = null;
try { BACKUP = JSON.parse(localStorage.getItem('aio-backup-v1') || 'null'); if (BACKUP) S.backupAt = BACKUP.savedAt || 0; } catch (e) { }
setTz(S.settings.tz);
/* simulated MQTT link: nothing leaves the page */
S.mq = {
  state: S.settings.mqtt ? 'connected' : 'disabled', lastConn: Date.now() - 12 * MIN, inN: 142, outN: 389, err: '', showPw: false, touched: {},
  log: [
    { t: Date.now() - 40000, dir: 'out', topic: 'aio/hub/status', payload: 'online' },
    { t: Date.now() - 95000, dir: 'out', topic: 'aio/node/n3/state', payload: '{"online":true,"hopper_low":true}' },
    { t: Date.now() - 210000, dir: 'out', topic: 'aio/node/n1/event/feed_result', payload: '{"status":"OK","amount":6}' }
  ]
};
const node = id => D.nodes.find(n => n.id === id);
let nextId = 100;
const uid = p => p + (nextId++);
const PRESET = { all: [1, 1, 1, 1, 1, 1, 1], weekdays: [0, 1, 1, 1, 1, 1, 0], weekends: [1, 0, 0, 0, 0, 0, 1] };
const lvlOf = n => n.lvl != null ? n.lvl : n.hopper === 'low' ? 15 : 70;
const capOf = n => n.capacity || (n.kind === 'pump' ? 1000 : n.kind === 'auger' ? 5000 : 1500);
const holdOn = () => (S.settings.holdUntil || 0) > Date.now();
const skipOn = sc => !!sc.skip && sc.skip > Date.now() - 60000;
const dailyUse = n => n.scheds.filter(sc => sc.on).reduce((a, sc) => a + sc.amount * sc.days.filter(Boolean).length / 7, 0);
/* next run of a schedule, ignoring an occurrence the user skipped and anything inside hold mode */
function nextRun(sc) {
  let t = nextOccurrence(sc.h, sc.m, sc.days);
  for (let i = 0; t && i < 20; i++) {
    const skipped = sc.skip && Math.abs(t - sc.skip) < 60000, held = holdOn() && t < S.settings.holdUntil;
    if (!skipped && !held) break;
    t = nextOccurrence(sc.h, sc.m, sc.days, t);
  }
  return t;
}
const holdBanner = () => holdOn() ? `<div class="banner warn" style="width:auto;margin:8px 16px 0" role="status">${icon('pause')}<span class="od-fill">Hold mode until ${esc(stamp(S.settings.holdUntil))}. Scheduled feeds are skipped on all nodes. Manual feeds still work.</span><button class="btn sm" data-act="hold-end" data-fid="hold-end">End hold</button></div>` : '';
/* stock level is an estimate: it counts down from what the node has fed since the last refill */
function useStock(n, amount) {
  const was = n.hopper;
  n.lvl = Math.max(0, +(lvlOf(n) - amount / capOf(n) * 100).toFixed(1));
  n.hopper = n.lvl <= 20 ? 'low' : 'ok';
  if (n.hopper === 'low' && was !== 'low') {
    D.alerts.unshift({ id: uid('a'), sev: 'warn', nodeId: n.id, text: `${hopperTxt(n)} level is estimated low (about ${Math.round(n.lvl)}%). Refill soon.`, t: Date.now(), ack: false });
    notify('Low', `${n.name}: ${hopperTxt(n).toLowerCase()} is estimated low, about ${Math.round(n.lvl)}%. Refill soon.`);
  }
}
/* short text messages for phone notifications, sent over MQTT on aio/hub/notify */
function notify(kind, text, force) {
  const st = S.settings;
  if (!force && (!st.nOn || !st['n' + kind])) return;
  const sent = S.mq.state === 'connected';
  S.notif.unshift({ t: Date.now(), text, sent }); S.notif.length = Math.min(S.notif.length, 6);
  if (sent) logMq('out', 'aio/hub/notify', JSON.stringify({ text }));
}
function feedPreview(n, amount) {
  if (n.status === 'offline') return { tone: 'badt', text: 'Node is offline, so it cannot feed.' };
  const code = precheck(n, amount, 'manual');
  if (code) return { tone: CODE[code][1] === 'bad' ? 'badt' : 'warnt', text: `Would be refused now: ${CODE[code][0].toLowerCase()}.` };
  const hl = n.hourCap - used(n, HOUR) - amount, dl = n.dayCap - used(n, 24 * HOUR) - amount;
  const how = n.calIn === 's' ? ` About ${(amount / n.cal).toFixed(1)} s open.` : n.calIn === 'pulses' ? ` About ${Math.max(1, Math.round(amount / n.cal))} pulses.` : '';

/* ===== Feed engine (hub proposes, node disposes) ===== */
const Q = []; let busy = false;
const used = (n, ms) => D.history.filter(h => h.nodeId === n.id && h.code === 'OK' && Date.now() - h.t < ms).reduce((a, h) => a + h.amount, 0);

function precheck(n, amount, src) {
  if (n.status === 'fault') return 'REJ_FAULT';
  if (Date.now() - n.lastAct < n.cooldownS * 1000) return 'REJ_COOLDOWN';
  if (amount > n.maxAmount) return 'REJ_TOO_LONG';
  if (used(n, HOUR) + amount > n.hourCap) return 'REJ_LIMIT_HOUR';
  if (used(n, 24 * HOUR) + amount > n.dayCap) return 'REJ_LIMIT_DAY';
  if (n.vin && n.vin < 10500) return 'REJ_LOW_VOLT';
  return null;
}
function record(n, amount, code, ms, src) {
  D.history.unshift({ id: uid('h'), t: Date.now(), nodeId: n.id, amount, unit: n.unit, code, ms, src });
  const keep = Date.now() - (+S.settings.retain || 30) * 86400000;
  D.history = D.history.filter(h => h.t >= keep);
}
function enqueue(id, amount, src) {
  const n = node(id);
  if (!n || n.feed || S.rebooting) return;
  if (n.status === 'offline') {
    record(n, amount, 'TIMEOUT_NO_RESULT', 0, src);
    const catchUp = src === 'schedule' && n.missed === 'catch';
    if (catchUp) n.pendingCatch = { amount, until: Date.now() + 30 * MIN };
    D.alerts.unshift({ id: uid('a'), sev: 'warn', nodeId: id, text: `Missed feed (${amount} ${n.unit}) while offline. ${catchUp ? 'One catch-up feed runs if the node returns within 30 min.' : 'Skipped by policy, not retried.'}`, t: Date.now(), ack: false });
    notify('Missed', `${n.name} missed a ${amount} ${n.unit} feed while offline.${catchUp ? ' One catch-up feed runs if it returns within 30 min.' : ''}`);
    toast(`${n.name} is offline — ${catchUp ? 'catch-up queued for 30 min' : 'feed skipped'}`, 'warn'); render(); return;
  }
  n.feed = { state: 'QUEUED' }; Q.push({ id, amount, src }); pump(); render();
}
function pump() {
  if (busy || !Q.length) return;
  busy = true;
  const j = Q.shift(), n = node(j.id);
  if (!n) { busy = false; return pump(); }
  n.feed = { state: 'SENT' }; render();
  setTimeout(() => {
    const code = precheck(n, j.amount, j.src);
    if (code) return finish(n, j, code, 0);
    n.feed = { state: 'ON' }; render();
    const ms = Math.min(1800, 600 + j.amount * (n.unit === 'pulses' ? 110 : 6));
    setTimeout(() => finish(n, j, 'OK', ms), ms);
  }, 450);
}
function finish(n, j, code, ms) {
  n.feed = null;
  record(n, j.amount, code, ms, j.src);
  if (S.mq.state === 'connected') logMq('out', `aio/node/${n.id}/event/feed_result`, JSON.stringify({ status: code, amount: j.amount }));
  if (code === 'OK') { n.lastAct = Date.now(); n.reject = null; useStock(n, j.amount); toast(`${n.name}: ${j.amount} ${n.unit} dispensed`, 'ok'); }
  else {
    n.reject = { code, t: Date.now() };
    if (CODE[code][2] === 'fault' && code !== 'ABORTED') notify('Fault', `${n.name}: ${CODE[code][0].toLowerCase()}. Check the feeder before feeding again.`);
  }
  if (code !== 'OK') toast(`${n.name}: not fed — ${CODE[code][0].toLowerCase()}`, CODE[code][1]);
  busy = false; render(); pump();
}

/* scheduler: evaluates once per second, never catches up missed minutes */
const fired = new Set();
function schedTick() {
  if (S.rebooting) return;
  if (S.settings.holdUntil && S.settings.holdUntil <= Date.now()) { S.settings.holdUntil = 0; toast('Hold ended. Scheduled feeds resume.', 'ok'); render(); }
  for (const n of D.nodes) if (n.status === 'offline' && n.seen && !n.offNotified && Date.now() - n.seen > 30 * MIN) { n.offNotified = true; notify('Offline', `${n.name} has been offline for 30 min.`); if (S.view === 'remote') render(); }
  const p = parts(Date.now()); const key = `${p.y}${p.mo}${p.d}${p.h}${p.mi}`;
  for (const n of D.nodes) {
    if (n.paused) continue;
    for (const s of n.scheds) {
      if (!s.on || s.h !== p.h || s.m !== p.mi || !s.days[p.dow]) continue;
      const k = key + n.id + s.id; if (fired.has(k)) continue; fired.add(k);
      if (holdOn()) { record(n, s.amount, 'SKIPPED_HOLD', 0, 'schedule'); render(); continue; }
      if (s.skip && Math.abs(Date.now() - s.skip) < 90000) { s.skip = 0; record(n, s.amount, 'SKIPPED_USER', 0, 'schedule'); render(); continue; }
      enqueue(n.id, s.amount, 'schedule');

}

      <div class="od-row" style="--od-gap:16px;align-items:flex-end;flex-wrap:wrap"><div><label class="lab" for="wz-ct">Total capacity when full (${esc(n.unit)})</label><input id="wz-ct" type="number" inputmode="numeric" min="1" max="100000" step="10" value="${esc(String(w.capTotal))}" data-fid="wz-ct" style="width:170px"></div>
      <div><label class="lab" for="wz-cn">Amount in it now (${esc(n.unit)})</label><input id="wz-cn" type="number" inputmode="numeric" min="0" max="100000" step="10" value="${esc(String(w.capNow))}" data-fid="wz-cn" style="width:170px"></div></div>

VIEWS.pair = () => {
  const p = D.pairing;
  if (!p) return VIEWS.settings();
  const left = Math.max(0, Math.ceil((p.until - Date.now()) / 1000));
  const found = p.found.filter(f => !f.taken);
  let body;
  if (left === 0 && !found.length) body = `<div class="empty">${icon('wifioff')}<b>No node found</b><span>The pairing window closed. Hold the node's button while powering it on, then try again.</span><button class="btn primary" data-act="pair-restart" data-fid="pr">Restart window</button></div>`;
  else body = (left === 0 ? '<p class="cap pad">Window closed. Discovered nodes can still be accepted.</p>' : '') + (found.length ? found.map(f => `<div class="item"><div class="od-fill"><div class="val num">${esc(f.mac)}</div><div class="cap">${f.mcu} · fw ${f.fw} · RSSI ${f.rssi} dBm</div></div><button class="btn primary sm" data-act="pair-pick" data-id="${f.mac}" data-fid="pp-${f.mac}">Accept</button></div>`).join('') : `<div class="empty"><div class="skel" style="width:360px" aria-hidden="true"></div><b>Listening for nodes…</b><span>Power the node with its pairing button held.</span></div>`);
  return `<div class="screen od-screen">${sbar('Add node', true, `<span class="pill ${left ? 'ok' : 'off'} num" id="pcount">${left ? left + ' s left' : 'Closed'}</span>`)}<div class="od-scroll">${body}</div></div>`;
};

VIEWS.cal = () => {
  const c = S.cal, n = node(c.nodeId);
  const stepN = c.step === 'setup' ? 1 : c.step === 'run' ? 2 : c.step === 'weigh' ? 3 : 4;
  const steps = `<div class="steps" aria-hidden="true">${[1, 2, 3, 4].map(i => `<span class="${i <= stepN ? 'on' : ''}"></span>`).join('')}</div>`;
  let body = '';
  const inU = n.calIn === 's' ? 's' : 'pulses';
  if (c.step === 'setup') body = `
    <p class="val">Run ${c.runs.length + 1} of 3</p>
    <p class="cap">Place a container under the outlet. The node runs a test under its normal safety limits.</p>
    <div class="srow"><span>Test amount</span><div class="stepper"><button class="btn" data-act="cal-amt" data-d="-1" data-fid="ca-m" aria-label="Decrease test amount">${icon('minus')}</button><output class="num">${c.test} ${inU}</output><button class="btn" data-act="cal-amt" data-d="1" data-fid="ca-p" aria-label="Increase test amount">${icon('plus')}</button></div></div>
    ${c.runs.length ? `<p class="cap num">Recorded: ${c.runs.map(r => r.toFixed(2)).join(' · ')} ${n.calOut}/${inU === 's' ? 's' : 'pulse'}</p>` : ''}
    <div class="actions"><button class="btn primary" data-act="cal-run" data-fid="cal-run">Dispense test</button></div>`;
  else if (c.step === 'run') body = `<p class="val">Dispensing ${c.test} ${inU}…</p><div class="prog" role="progressbar" aria-label="Test dispense"><div id="calprog"></div></div><p class="cap">The node enforces its own on-time limit of ${(n.maxOnMs / 1000).toFixed(1)} s.</p>`;
  else if (c.step === 'weigh') body = `
    <p class="val">How much came out?</p>
    <div class="srow"><span>Measured ${n.calOut === 'g' ? 'weight' : 'volume'}</span><div class="stepper"><button class="btn" data-act="cal-w" data-d="-1" data-fid="cw-m" aria-label="Decrease measured value">${icon('minus')}</button><output class="num">${c.w} ${n.calOut}</output><button class="btn" data-act="cal-w" data-d="1" data-fid="cw-p" aria-label="Increase measured value">${icon('plus')}</button></div></div>
    ${c.w < 5 ? `<p class="err" role="alert">Under 5 ${n.calOut} is too little to weigh reliably. Run a longer test.</p>` : ''}
    <div class="actions"><button class="btn primary" data-act="cal-rec" data-fid="cal-rec" ${c.w < 5 ? 'disabled' : ''}>Record result</button></div>`;
  else { const med = median(c.runs), ratio = med / n.cal, bad = ratio < .5 || ratio > 2;
    body = `<p class="val">Review (median of ${c.runs.length} runs)</p>
    <div class="kv"><span>Before</span><span class="num">${n.cal} ${n.calOut}/${inU === 's' ? 's' : 'pulse'}</span></div>
    <div class="kv"><span>After</span><span class="num">${med.toFixed(2)} ${n.calOut}/${inU === 's' ? 's' : 'pulse'}</span></div>
    ${bad ? `<p class="err">This is far from the old value (${Math.round(ratio * 100)}%). Check the container, then redo the runs.</p>` : ''}
    <div class="actions"><button class="btn primary" data-act="cal-save" data-fid="cal-save" ${bad ? 'disabled' : ''}>Save and push to node</button><button class="btn" data-act="cal-redo" data-fid="cal-redo">Redo runs</button></div>`; }

};

/* ===== Toast / dialog ===== */
let toastT;
function fbInfo(n) {
  const pushed = n.pushedAt || (Date.now() - 2 * HOUR), left = pushed + 7 * 86400000 - Date.now();
  return { pushed, left, valid: left > 0 };
}
function backOnline(n) {
  n.status = 'online'; n.seen = Date.now(); n.offNotified = false;
  D.alerts.filter(a => a.nodeId === n.id && a.sev === 'warn' && /offline|Missed/.test(a.text)).forEach(a => { a.ack = true; });
  const p = n.pendingCatch; n.pendingCatch = null;
  if (p && n.missed === 'catch' && Date.now() < p.until) { toast(`${n.name} is back — running one catch-up feed`, 'ok'); enqueue(n.id, p.amount, 'catchup'); }
  else toast(`${n.name} is back online${p ? '. The catch-up window had passed, so the missed feed stays skipped.' : ''}`, p ? 'warn' : 'ok');
}
function needPin(kind) {
  const s = S.settings;
  if (!s.pin || !s.pinCode || Date.now() < S.unlockUntil) return false;
  return kind === 'settings' || s.pinScope === 'all';
}
function askPin(then, why) {
  S.pinThen = then; S.pinErr = '';
  openDlg(() => `<h2>Enter PIN</h2><p class="cap" style="margin-bottom:12px">${esc(why)}</p><label class="lab" for="pinin">PIN (4 digits)</label><input id="pinin" type="password" inputmode="numeric" maxlength="4" data-first data-fid="pinin" style="width:160px" ${S.pinErr ? 'aria-invalid="true"' : ''}>${S.pinErr ? `<p class="err">${S.pinErr}</p>` : ''}<div class="foot"><button class="btn" data-act="dlg-close" data-fid="pcancel">Cancel</button><button class="btn primary" data-act="pin-check" data-fid="pcheck">Unlock</button></div>`);
}
function rebootHub(cold) {
  S.rebooting = true; S.cold = !!cold; Q.length = 0; busy = false;
  for (const n of D.nodes) { if (n.feed && n.feed.state === 'ON') record(n, n.amount, 'ABORTED', 0, 'reboot'); n.feed = null; }
  const steps = ['Relay outputs OFF', 'Loading saved settings', 'Syncing time', 'Reaching nodes'];
  const boot = $('#boot'), list = $('#bootsteps'), bar = $('#bootprog');
  $('#dim').hidden = true; boot.hidden = false;
  let i = 0;
  const draw = () => {
    list.innerHTML = steps.map((t, k) => `<li class="${k < i ? 'done' : ''}">${k < i ? icon('check') : '<span class="od-icon" aria-hidden="true"></span>'}<span>${t}${k === i ? '…' : ''}</span></li>`).join('');
    bar.style.width = (i / steps.length * 100) + '%';
  };
  draw();
  const iv = setInterval(() => {
    i++;
    if (i >= steps.length) { clearInterval(iv); bar.style.width = '100%'; S.bootAbort = null; setTimeout(finishReboot, 700); return; }
    draw();
  }, 900);
  S.bootAbort = () => { clearInterval(iv); S.bootAbort = null; finishReboot(); };
}
function finishReboot() {
  $('#boot').hidden = true; S.rebooting = false; S.unlockUntil = 0;
  if (S.settings.ntp) S.syncedAt = Date.now();
  if (S.cold) { S.cold = false; go('home', { nodeId: null, cal: null }); wake(); return; }
  S.mq.inN = 0; S.mq.outN = 0; S.mq.log = [];
  D.alerts.unshift({ id: uid('a'), sev: 'warn', nodeId: null, text: 'Hub restarted from Settings. Schedules resumed after the time sync; feeds missed during the restart were skipped.', t: Date.now(), ack: true });
  go('home', { nodeId: null, cal: null });

    if (S.sd !== 'ok') return toast('No SD card to back up to', 'warn');
    BACKUP = makeBackup(); S.backupAt = BACKUP.savedAt;
    try { localStorage.setItem('aio-backup-v1', JSON.stringify(BACKUP)); } catch (e) { }
    toast('Backup saved to SD (simulated)', 'ok'); render();
  },
  'backup-restore': () => confirmDlg('Restore from the backup?', `This replaces nodes, schedules and settings with the backup from ${stamp(S.backupAt)}. Feed history is not changed. The PIN and MQTT password stay as they are now.`, 'Restore', 'backup-restore-ok'),
  'backup-restore-ok': () => {
    if (!BACKUP) return;
    D.nodes = JSON.parse(JSON.stringify(BACKUP.nodes)); D.nodes.forEach(nd => { nd.feed = null; });
    Object.assign(S.settings, BACKUP.settings); setTz(S.settings.tz);
    $('#dlg').close(); $('#scrim').hidden = true; dlgRender = null; applyTheme(); applyBright();
    toast('Settings restored from backup', 'ok'); go('settings');
  },
  'backup-download': () => {
    const bk = makeBackup(), d = new Date(), nm = `aio-backup-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.json`;
    toast(saveFile(nm, JSON.stringify(bk, null, 2), 'application/json') ? `Saved ${nm}` : 'Download is blocked in this preview', 'ok');
  },
  'notif-test': () => { notify('Test', 'Test message from the AIO hub.', true); render(); },
  'setup-start': () => { D.pairing = null; S.setup = { step: 0, nodeId: null, h: 7, m: 0, days: 'all', amount: 0, wifi: '', saved: '', capNode: null, capTotal: '', capNow: '', capErr: '' }; go('setup'); },
  'wz-next': () => {
    const w = S.setup; if (w.step === 2 && !node(w.nodeId)) return;
    if (w.step === 3) {
      const nd = node(w.nodeId), tv = $('#wz-ct').value.trim(), nv = $('#wz-cn').value.trim();
      w.capTotal = tv; w.capNow = nv; w.capErr = capCheck(tv, nv, nd.unit);
      if (w.capErr) { render(); $(/^Enter the amount|more than/.test(w.capErr) ? '#wz-cn' : '#wz-ct').focus(); return; }
      setCap(nd, Number(tv), Number(nv));
    }
    w.step = Math.min(5, w.step + 1);
    if (w.step === 3) { const nd = node(w.nodeId); if (nd && w.capNode !== nd.id) { w.capNode = nd.id; w.capTotal = capOf(nd); w.capNow = Math.round(lvlOf(nd) / 100 * capOf(nd)); w.capErr = ''; } }
    if (w.step === 4 && !w.amount) { const nd = node(w.nodeId); if (nd) w.amount = nd.amount; }
    render();
  },
  'wz-node': b => { const nd = node(b.dataset.id); S.setup.nodeId = nd.id; S.setup.amount = nd.amount; render(); },
  'wz-wifi': () => { const w = S.setup; w.wifi = 'busy'; render(); setTimeout(() => { if (S.setup === w) { w.wifi = 'ok'; if (S.view === 'setup') render(); } }, 1200); },
  'wz-step': b => { const w = S.setup, d = +b.dataset.d; if (b.dataset.k === 'h') w.h = (w.h + d + 24) % 24; else w.m = (w.m + d + 60) % 60; render(); },
  'wz-amt': b => { const w = S.setup, nd = node(w.nodeId); w.amount = Math.max(nd.step, w.amount + (+b.dataset.d) * nd.step); render(); },
  'wz-days': b => { S.setup.days = b.dataset.v; render(); },
  'wz-save': () => {
    const w = S.setup, nd = node(w.nodeId); if (!nd || w.amount > nd.maxAmount) return;
    nd.scheds.push({ id: uid('s'), h: w.h, m: w.m, days: [...PRESET[w.days]], amount: w.amount, on: true }); nd.pushedAt = Date.now();
    w.saved = `${pad2(w.h)}:${pad2(w.m)}`; w.step = 5; toast('Schedule saved', 'ok'); render();
  },
  'wz-done': () => { S.setup = null; go('home'); },
  'dlg-close': () => closeDlg(),
  'sched-open': b => go('schedule', { schedNode: b.dataset.id, nodeId: null }),
  'sched-node': b => { S.schedNode = b.dataset.id; render(); },
  'sched-toggle': b => { const n = node(S.schedNode), s = n.scheds.find(x => x.id === b.dataset.id); s.on = !s.on; n.pushedAt = Date.now(); render(); },
  'sched-edit': b => {
    const n = node(S.schedNode), s = b.dataset.id && n.scheds.find(x => x.id === b.dataset.id);
    S.edit = s ? { nodeId: n.id, id: s.id, h: s.h, m: s.m, days: [...s.days], amount: s.amount, on: s.on } : { nodeId: n.id, id: null, h: 12, m: 0, days: [1, 1, 1, 1, 1, 1, 1], amount: n.amount, on: true };
    openDlg(schedDlg);
  },
  'ed-step': b => { const e = S.edit, d = +b.dataset.d; if (b.dataset.k === 'h') e.h = (e.h + d + 24) % 24; else e.m = (e.m + d + 60) % 60; redrawDlg(); },
  'ed-amt': b => { const e = S.edit, n = node(e.nodeId); e.amount = Math.max(n.step, e.amount + (+b.dataset.d) * n.step); e.errAmt = false; redrawDlg(); },
  'ed-day': b => { const e = S.edit; e.days[+b.dataset.i] = e.days[+b.dataset.i] ? 0 : 1; e.errDays = false; redrawDlg(); },
  'ed-on': () => { S.edit.on = !S.edit.on; redrawDlg(); },
  'ed-save': () => {
    const e = S.edit, n = node(e.nodeId);
    e.errDays = !e.days.some(Boolean); e.errAmt = e.amount > n.maxAmount;
    if (e.errDays || e.errAmt) { redrawDlg(); return; }
    if (e.id) Object.assign(n.scheds.find(s => s.id === e.id), { h: e.h, m: e.m, days: e.days, amount: e.amount, on: e.on });
    else n.scheds.push({ id: uid('s'), h: e.h, m: e.m, days: e.days, amount: e.amount, on: e.on });
    n.pushedAt = Date.now(); closeDlg(); toast(`Saved. Pushing to ${n.name}…`, 'ok');
  },
  'ed-del': () => {
    const e = S.edit, n = node(e.nodeId), idx = n.scheds.findIndex(s => s.id === e.id), s = n.scheds[idx];
    n.scheds.splice(idx, 1); n.pushedAt = Date.now(); closeDlg();
    toast('Schedule deleted', '', () => { n.scheds.splice(Math.min(idx, n.scheds.length), 0, s); toast('Schedule restored', 'ok'); render(); });
  },
  hfilter: b => { S.hFilter = b.dataset.k; render(); },
  export: () => {
    const d = new Date(), nm = `feedlog-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.csv`;
    const rows = [['time', 'node', 'amount', 'unit', 'result', 'source']].concat(D.history.map(h => { const nd = node(h.nodeId); return [new Date(h.t).toISOString(), nd ? nd.name : 'Removed node', h.amount, h.unit, h.code, h.src]; }));
    const ok = saveFile(nm, rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
    toast(ok ? `Exported ${D.history.length} rows as ${nm}` : `Export is blocked in this preview (${D.history.length} rows)`, ok ? 'ok' : 'warn');
  },
  ack: b => { D.alerts.find(a => a.id === b.dataset.id).ack = true; render(); },
  ackall: () => { D.alerts.forEach(a => a.ack = true); render(); },
  'set-toggle': b => {
    const k = b.dataset.k;
    if (k === 'pin' && !S.settings.pin) { S.pinErr = ''; return openDlg(() => `<h2>Set a PIN</h2><div class="stack"><div><label class="lab" for="pin">4-digit PIN (required)</label><input id="pin" type="password" inputmode="numeric" maxlength="4" data-first data-fid="pin" ${S.pinErr ? 'aria-invalid="true"' : ''}>${S.pinErr ? `<p class="err">${S.pinErr}</p>` : ''}</div></div><div class="foot"><button class="btn" data-act="dlg-close" data-fid="pcancel">Cancel</button><button class="btn primary" data-act="pin-save" data-fid="psave">Enable PIN</button></div>`); }
    S.settings[k] = !S.settings[k]; if (k === 'ntp' && S.settings.ntp) S.syncedAt = Date.now();
    if (k === 'mqtt') { if (S.settings.mqtt) mqConnect(); else { S.mq.state = 'disabled'; S.mq.err = ''; } }
    render();
  },
  'pin-save': () => { const v = $('#pin').value; if (!/^\d{4}$/.test(v)) { S.pinErr = 'Use exactly 4 digits, for example 4821.'; redrawDlg(); return; } S.settings.pin = true; S.settings.pinCode = v; S.unlockUntil = Date.now() + 60000; closeDlg(); toast('PIN lock enabled', 'ok'); },
  ota: () => { S.otaState = 'check'; render(); setTimeout(() => { S.otaState = 'done'; render(); toast('Hub firmware is up to date', 'ok'); }, 2200); },
  factory: () => openDlg(() => `<h2>Factory reset this hub?</h2><p>This erases all nodes, schedules and history. It cannot be undone.</p><label class="lab" for="rst" style="margin-top:12px">Type RESET to confirm</label><input id="rst" type="text" autocomplete="off" data-first data-fid="rst" style="width:200px"><div class="foot"><button class="btn" data-act="dlg-close" data-fid="d-cancel">Cancel</button><button class="btn danger" id="rst-go" data-act="factory-ok" data-fid="rst-go" disabled>Erase everything</button></div>`),
  'factory-ok': () => { try { localStorage.removeItem(KEY); } catch (e) { } D = seed(); Q.length = 0; busy = false; $('#dlg').close(); $('#scrim').hidden = true; dlgRender = null; toast('Hub reset. Sample data restored.', 'warn'); go('home'); },
  pair: () => { D.pairing = { until: Date.now() + 60000, found: [] }; schedulePairFind(); go('pair'); },
  'pair-restart': () => { D.pairing.until = Date.now() + 60000; schedulePairFind(); render(); },
  'pair-pick': b => { const f = D.pairing.found.find(x => x.mac === b.dataset.id); S.pairErr = ''; S.pairDraft = null; openDlg(() => pairNameDlg(f)); },
  'pair-accept': b => {
    const name = $('#pn').value.trim(), f = D.pairing.found.find(x => x.mac === b.dataset.id), kind = $('#pt').value, tpl = TEMPL[kind];
    const tv = $('#pc-total').value.trim(), nv = $('#pc-now').value.trim();
    S.pairDraft = { name, tpl: kind, total: tv, now: nv };
    S.pairErr = !name ? 'Give the node a name, for example "Chicken Run".' : capCheck(tv, nv, tpl[1]);
    if (S.pairErr) { $('#dlg').innerHTML = pairNameDlg(f); $(!name ? '#pn' : (/^Enter the amount|more than/.test(S.pairErr) ? '#pc-now' : '#pc-total')).focus(); return; }
    const total = Math.round(Number(tv)), lvl0 = +(Number(nv) / Number(tv) * 100).toFixed(1);
    S.pairDraft = null; S.pairErr = '';
    f.taken = true;
    D.nodes.push({ id: uid('n'), name, mcu: f.mcu, mech: tpl[0], kind, unit: tpl[1], status: 'online', hopper: lvl0 <= 20 ? 'low' : 'ok', vin: 12000, rssi: f.rssi, fw: f.fw, amount: tpl[2], step: tpl[3], cal: kind === 'gate' ? 4 : kind === 'auger' ? 20 : 8, calIn: 's', calOut: kind === 'pump' ? 'ml' : 'g', test: kind === 'gate' ? 2 : 5, maxAmount: tpl[4], hourCap: tpl[5], dayCap: tpl[6], maxOnMs: tpl[7], cooldownS: 15, feed: null, paused: false, lastAct: 0, calAt: Date.now(), scheds: [], lvl: lvl0, capacity: total, capCustom: total !== PCAP[kind], note: '', refills: [{ t: Date.now(), lvl: lvl0, set: true }] });
    $('#dlg').close(); $('#scrim').hidden = true; dlgRender = null; D.pairing = null; toast(`${name} paired. Calibrate it before first use.`, 'ok');
    if (S.setup) { const nn = D.nodes[D.nodes.length - 1]; S.setup.nodeId = nn.id; S.setup.amount = nn.amount; S.setup.step = 4; go('setup'); } else go('home');
  },
  calstart: b => { const n = node(b.dataset.id); S.cal = { nodeId: n.id, step: 'setup', runs: [], test: n.test, w: 0 }; go('cal'); },
  'cal-amt': b => { const n = node(S.cal.nodeId); S.cal.test = Math.min(Math.max(1, Math.floor(n.maxOnMs / 1000)), Math.max(1, S.cal.test + (+b.dataset.d))); render(); },
  'cal-run': () => {
    const c = S.cal, n = node(c.nodeId); c.step = 'run'; render();
    let p = 0; const iv = setInterval(() => { p += 10; const el = $('#calprog'); if (el) el.style.width = p + '%'; if (p >= 100) { clearInterval(iv); c.w = Math.max(1, Math.round(c.test * n.cal * (0.95 + Math.random() * 0.1))); c.step = 'weigh'; render(); } }, 220);
  },
  'cal-w': b => { S.cal.w = Math.max(1, S.cal.w + (+b.dataset.d)); render(); },
  'cal-rec': () => { const c = S.cal; c.runs.push(c.w / c.test); c.step = c.runs.length >= 3 ? 'review' : 'setup'; render(); },
  'cal-redo': () => { S.cal.runs = []; S.cal.step = 'setup'; render(); },
  'cal-save': () => { const c = S.cal, n = node(c.nodeId); n.cal = +median(c.runs).toFixed(2); n.calAt = Date.now(); toast(`${n.name}: calibration saved`, 'ok'); go('node', { cal: null }); }
};

function schedulePairFind() {
  const p = D.pairing, pool = [['7C:DF:A1:3B:09:E4', 'ESP32-C3', '0.4.2', -57], ['A4:CF:12:8E:55:10', 'ESP8266', '0.4.1', -71]];
  pool.forEach((f, i) => setTimeout(() => { if (D.pairing === p && !p.found.some(x => x.mac === f[0]) && Date.now() < p.until + 1) { p.found.push({ mac: f[0], mcu: f[1], fw: f[2], rssi: f[3] }); if (S.view === 'pair') render(); } }, 1800 + i * 3500));
}

/* ===== Events ===== */
document.addEventListener('click', e => {
  wake();
  const h = e.target.closest('[data-hold]');
  if (h) { if (!h.disabled && Date.now() - hold.fired > 600 && e.detail > 0) toast('Press and hold the button to confirm the feed'); return; }
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b);
});
document.addEventListener('change', e => {
  if (e.target.id === 'pt') {
    const k = e.target.value, t = $('#pc-total'), n = $('#pc-now'); if (t && n) { t.value = PCAP[k]; n.value = PCAP[k]; }
    document.querySelectorAll('.pc-u').forEach(x => { x.textContent = k === 'pump' ? 'ml' : 'g'; }); return;
  }
  const wz = e.target.dataset && e.target.dataset.wz;
  if (wz) { if (wz === 'tz') { S.settings.tz = e.target.value; setTz(e.target.value); } else if (wz === 'ssid') S.settings.ssid = e.target.value; render(); return; }
  const k = e.target.dataset && e.target.dataset.bind; if (!k) return;
  const v = e.target.value, s = S.settings;
  if (k === 'hnode') S.hNode = v;
  else if (k === 'tz') { s.tz = v; setTz(v); } else if (k === 'off') s.off = +v; else if (k === 'bright') s.bright = +v;
  else { s[k] = v; S.mq.touched[k] = true; if (['broker', 'muser', 'mpass'].includes(k) && s.mqtt) mqConnect(); }
  render(); applyBright(); applyTheme();
});
document.addEventListener('input', e => { if (e.target.id === 'cap-total' || e.target.id === 'cap-now') { capLive(); return; } if (e.target.id === 'rst') { const g = $('#rst-go'); if (g) g.disabled = e.target.value.trim().toUpperCase() !== 'RESET'; return; } if (e.target.dataset && e.target.dataset.bind === 'bright') { S.settings.bright = +e.target.value; applyBright(); const l = $('label[for=bright] .num'); if (l) l.textContent = S.settings.bright + '%'; } });

/* hold-to-confirm */
function startHold(el, e) {
  if (el.disabled || hold.active) return;
  hold.active = true; hold.id = el.dataset.hold; hold.x = e ? e.clientX : NaN; hold.y = e ? e.clientY : NaN;
  el.classList.add('holding'); el.querySelector('.lbl').textContent = 'Keep holding…';
  hold.timer = setTimeout(() => {
    hold.fired = Date.now(); hold.active = false;
    const amt = +el.dataset.amt, id = el.dataset.hold; hold.dirty = false;
    try { if (navigator.vibrate) navigator.vibrate(40); } catch (err) { }
    if (needPin('feed')) { render(); return askPin(() => manualFeed(id, amt), 'Manual feeding is locked.'); }
    manualFeed(id, amt);
  }, 800);
}
function applyTheme() { document.documentElement.dataset.theme = S.settings.theme === 'light' ? 'light' : 'dark'; }
document.addEventListener('pointermove', e => { if (hold.active && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 14) endHold($('[data-hold].holding')); });
function endHold(el) {
  if (!hold.active) return;
  clearTimeout(hold.timer); hold.active = false;
  if (el) { el.classList.remove('holding'); }
  if (hold.dirty) { hold.dirty = false; render(); } else render();
}
document.addEventListener('pointerdown', e => { wake(); const h = e.target.closest('[data-hold]'); if (h) startHold(h, e); });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, e => { if (hold.active) endHold($('[data-hold].holding')); }));
document.addEventListener('pointerleave', () => { if (hold.active) endHold($('[data-hold].holding')); }, true);
document.addEventListener('keydown', e => {
  wake();
  const h = e.target.closest && e.target.closest('[data-hold]');
  if (h && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); if (!e.repeat) startHold(h); return; }
  if (e.key === 'Enter' && e.target.id === 'pinin') { e.preventDefault(); ACT['pin-check'](); return; }
  const d = $('#dlg');
  if (d.open) {
    if (e.key === 'Escape') { e.preventDefault(); closeDlg(); }
    else if (e.key === 'Tab') { const f = [...d.querySelectorAll('button:not(:disabled),input,select,textarea')]; if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
});
document.addEventListener('keyup', e => { if (hold.active && (e.key === ' ' || e.key === 'Enter')) endHold($('[data-hold].holding')); });

/* screen dimming, brightness, scaling */
let idleT;
function applyBright() { $('#app').style.filter = `brightness(${0.4 + S.settings.bright / 100 * 0.6})`; }
function wake() {
  const dim = $('#dim');
  if (!dim.hidden) { dim.hidden = true; }
  clearTimeout(idleT); if (S.settings.off > 0) idleT = setTimeout(() => { if (!document.hidden) { $('#dimclk').textContent = hhmm(Date.now()); $('#dim').hidden = false; } }, S.settings.off * 1000);
}
$('#dim').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); $('#dim').hidden = true; wake(); });
function fit() { const s = Math.min(innerWidth / 800, innerHeight / 480); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit);

/* ===== Boot ===== */
fit(); applyBright(); applyTheme(); render(); wake();
$('#boot').addEventListener('pointerdown', () => { if (S.bootAbort) S.bootAbort(); });
rebootHub(true);
setInterval(() => {
  schedTick(); tickClock();
  if (D.pairing && S.view === 'pair') { const left = Math.max(0, Math.ceil((D.pairing.until - Date.now()) / 1000)); const pc = $('#pcount'); if (pc) { pc.textContent = left ? left + ' s left' : 'Closed'; if (!left) render(); } }
}, 1000);
</script>
</body>
