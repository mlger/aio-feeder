; Host unit tests — run with: pio test -d test
; Native (host) platform so safety-critical logic runs the same on CI and desk.

[platformio]
default_envs = host
test_dir = .
; keep build artifacts AND libdeps out of the scanned test tree (test_dir = .
; would otherwise pick up Unity's vendored examples inside .pio on re-runs)
build_dir = ../.pio-test/build
libdeps_dir = ../.pio-test/deps

[env:host]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I../lib/proto
    -I../node_core
    -I../link_core
    -I../hub/src
    -I../tools/sim
