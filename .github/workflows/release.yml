name: Release

# Semantic versioning: cut a release by pushing a vX.Y.Z tag.
# fix: -> patch, feat: -> minor, feat!/BREAKING CHANGE -> major
# (choose the bump from the commits since the previous tag).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Tests & firmware
    uses: ./.github/workflows/build.yml

  release:
    name: Attach firmware to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # ota_json.py (M8a) lives in the repo — this job never had a checkout
      # before M8a (gh worked with GH_REPO alone); the script needs the tree
      - name: Checkout (tools/flasher/ota_json.py)
        uses: actions/checkout@v4
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: dist
      - name: Zip firmware per target
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          for d in dist/fw-*; do
            env="${d#dist/fw-}"
            # stage a copy so each zip carries its own ota.json (M8a, D37) —
            # a self-hosted update server serves the extracted zip as-is
            mkdir -p "out/stage-$env"
            cp -f "$d"/* "out/stage-$env"/
            python3 tools/flasher/ota_json.py --dir "out/stage-$env" --version "$TAG"
            zip -qj "out/aio-feeder-${TAG}-${env}.zip" "out/stage-$env"/*
          done
          rm -rf out/stage-*
          ls -la out
      - name: Create GitHub Release (notes from commits since previous tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # no checkout in this job — tell gh where to act
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber out/*.zip
          else
            gh release create "$TAG" --title "$TAG" --generate-notes out/*.zip
          fi
      - name: Refresh the web flasher (Pages follows releases)
        # the flasher's release picker + promoted root only update on a
        # Pages deploy, which CI runs on main pushes — dispatch one now so
        # the new tag is flashable immediately
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main
