name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests & firmware
    uses: ./.github/workflows/build.yml

  qemu-hub:
    name: QEMU boot + UI screenshots (hub ESP32-S3)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build (QEMU sdkconfig — no octal PSRAM, UI shot mode)
        run: |
          . $IDF_PATH/export.sh
          idf.py -C hub -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.qemu.defaults" set-target esp32s3
          idf.py -C hub -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.qemu.defaults" build
      - name: Merge flash image
        run: |
          . $IDF_PATH/export.sh
          esptool.py --chip esp32s3 merge_bin -o hub/build/flash.img \
            --fill-flash-size 16MB \
            0x0 hub/build/bootloader/bootloader.bin \
            0x8000 hub/build/partition_table/partition-table.bin \
            0x10000 hub/build/aio-feeder-hub.bin
      - name: Boot in QEMU — smoke + capture UI screenshots
        run: |
          # QEMU runtime deps (the espressif/idf container may lack pixman/glib)
          (sudo apt-get update -qq && sudo apt-get install -y -qq \
             libglib2.0-0 libpixman-1-0 >/dev/null 2>&1) || true
          # pinned release asset — verified against the espressif/qemu releases API;
          # bump deliberately when the fork moves.
          curl -sL -o /tmp/qemu.tar.xz \
            https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          mkdir -p /tmp/qemu && tar -xf /tmp/qemu.tar.xz -C /tmp/qemu
          QEMU_BIN=$(find /tmp/qemu -name qemu-system-xtensa -type f | head -1)
          echo "qemu binary: $QEMU_BIN"
          . $IDF_PATH/export.sh
          python3 tools/qemu/capture.py \
            --qemu "$QEMU_BIN" \
            --flash hub/build/flash.img \
            --elf hub/build/aio-feeder-hub.elf \
            --screens dashboard,node_detail,sched_editor,history,alerts,pairing,pairing_code,pairing_form,pairing_done --out screens --timeout 320
      - name: Serial log tail (diagnosis)
        if: failure()
        run: tail -120 serial.log || true
      - name: Boot smoke assertions
        run: |
          tail -60 serial.log
          grep -q "aio-feeder-hub" serial.log
          grep -q "core ready" serial.log
          ! grep -q "Guru Meditation" serial.log
          test -f screens/dashboard.png
          test -f screens/node_detail.png
          test -f screens/sched_editor.png
          test -f screens/history.png
          test -f screens/alerts.png
          test -f screens/pairing.png
          test -f screens/pairing_code.png
          test -f screens/pairing_form.png
          test -f screens/pairing_done.png
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hub-ui-screens
          path: screens
          retention-days: 30
          if-no-files-found: error

  pages:
    name: Deploy web flasher to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: build
      - name: Restore per-env build layout
        run: |
          for d in build/fw-*; do
            mv "$d" "build/${d#build/fw-}"
          done
      - name: Assemble flasher site
        run: |
          VERSION=$(git describe --tags --always --dirty)
          python tools/flasher/make_manifests.py --build-dir build --version "$VERSION"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
